name: dient-samples

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dient
      POSTGRES_PASSWORD: dient
      POSTGRES_DB: dient
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dient -d dient"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dient
      MYSQL_DATABASE: shop
      MYSQL_USER: dient
      MYSQL_PASSWORD: dient
    ports:
      - "53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdient --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    # Redis Stack includes the RedisJSON module, so the sample has every view.
    image: redis/redis-stack-server:latest
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot seeder. It waits for Redis, then loads the sample keyspace.
  # Re-running `docker compose up -d` skips it once the marker key exists.
  redis-seed:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./docker/redis/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"

  rabbitmq:
    # The management plugin is what dient talks to; port 15672 is the HTTP API.
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dient
      RABBITMQ_DEFAULT_PASS: dient
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "55672:15672" # management API
      - "55673:5672" # AMQP, for clients that publish/consume outside dient
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # One-shot seeder for the sample topology and messages. Re-running
  # `docker compose up -d` only refills a sample queue when it is empty.
  rabbitmq-seed:
    image: rabbitmq:3-management-alpine
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "15672"
      RABBITMQ_USER: dient
      RABBITMQ_PASSWORD: dient
    volumes:
      - ./docker/rabbitmq/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  rabbitmq-data:
